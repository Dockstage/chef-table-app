name: chef-table

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chef_table
      POSTGRES_USER: chef_table
      POSTGRES_PASSWORD: chef_table
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chef_table -d chef_table"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: chef-table-backend:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://chef_table:chef_table@db:5432/chef_table
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: chef-table-backend:local
    build:
      context: ./backend
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+psycopg://chef_table:chef_table@db:5432/chef_table
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  seed:
    image: chef-table-backend:local
    build:
      context: ./backend
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+psycopg://chef_table:chef_table@db:5432/chef_table
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.db.seed"]

volumes:
  postgres-data:
